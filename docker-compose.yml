version: "3.8"

services:
  backend:
    build: ./api
    container_name: inventory-backend
    restart: always
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://mongo:27017/inventory_db
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-1d}
    expose:
      - "3000"
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - inventory-network

  mongo:
    image: mongo:6
    container_name: inventory-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    expose:
      - "27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - inventory-network

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: inventory-nginx
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - inventory-network

volumes:
  mongo-data:

networks:
  inventory-network:
    driver: bridge
